<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#151018" />
  <meta name="description" content="Depths of Shadow Reflections — a guided self-reflection and shadow-work journal." />
  <title>Depths of Shadow Reflections</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <div class="brand-kicker">Depths of Shadow Reflections</div>
        <div class="brand-sub">A private space to meet yourself</div>
      </div>
      <button id="installBtn" class="ghost small" hidden>Install</button>
    </header>

    <main id="view"></main>

    <nav class="bottom-nav" aria-label="Primary">
      <button data-view="home" class="nav-btn active">Home</button>
      <button data-view="journey" class="nav-btn">Journey</button>
      <button data-view="journal" class="nav-btn">Journal</button>
      <button data-view="tools" class="nav-btn">Tools</button>
      <button data-view="profile" class="nav-btn">Progress</button>
    </nav>
  </div>

  <template id="homeTemplate">
    <section class="hero">
      <div class="eyebrow">Today</div>
      <h1>Meet what is here.</h1>
      <p class="lead">Notice without forcing. Name without judging. Understand without abandoning yourself.</p>
      <div class="hero-actions">
        <button class="primary" id="dailyPromptBtn">Begin today's reflection</button>
        <button class="secondary" data-goto="grounding">Ground first</button>
      </div>
    </section>

    <section class="grid two">
      <article class="card">
        <div class="card-label">Current journey</div>
        <h2 id="homeJourneyTitle">30-Day Shadow Journey</h2>
        <p id="homeJourneyProgress" class="muted"></p>
        <div class="progress"><span id="homeJourneyBar"></span></div>
        <button class="secondary wide" data-view-jump="journey">Continue journey</button>
      </article>

      <article class="card">
        <div class="card-label">Check-in</div>
        <h2>What is strongest right now?</h2>
        <div id="emotionQuick" class="chip-wrap"></div>
        <p class="muted">Choose one word. Precision can soften overwhelm.</p>
      </article>
    </section>

    <section class="card">
      <div class="card-label">Gentle prompt</div>
      <h2 id="homePrompt"></h2>
      <textarea id="homePromptText" placeholder="Write freely. Your entry stays on this device unless you choose to export it."></textarea>
      <div class="row">
        <button class="primary" id="saveHomePrompt">Save reflection</button>
        <button class="ghost" id="shufflePrompt">New prompt</button>
      </div>
      <div id="homeSaveStatus" class="status"></div>
    </section>

    <section class="grid two">
      <button class="feature-card" data-goto="triggers">
        <span class="card-label">Pattern work</span>
        <strong>Triggers & projections</strong>
        <span>Separate activation from information.</span>
      </button>
      <button class="feature-card" data-goto="parts">
        <span class="card-label">Inner dialogue</span>
        <strong>Parts reflection</strong>
        <span>Listen for what a protective part needs.</span>
      </button>
      <button class="feature-card" data-goto="boundaries">
        <span class="card-label">Relational clarity</span>
        <strong>Boundaries</strong>
        <span>Find your own yes, no, maybe, and not now.</span>
      </button>
      <button class="feature-card" data-goto="feelings">
        <span class="card-label">Emotional literacy</span>
        <strong>Feelings vocabulary</strong>
        <span>Move beyond “fine,” “bad,” or “angry.”</span>
      </button>
    </section>
  </template>

  <template id="journeyTemplate">
    <section class="page-head">
      <div class="eyebrow">Structured practice</div>
      <h1>30-Day Shadow Journey</h1>
      <p class="lead">A paced sequence from awareness to integration. You can move in order or revisit any day.</p>
    </section>
    <section class="card">
      <div class="row between">
        <div>
          <div class="card-label">Progress</div>
          <h2 id="journeyCount"></h2>
        </div>
        <button class="ghost small" id="resetJourney">Reset</button>
      </div>
      <div class="progress"><span id="journeyBar"></span></div>
    </section>
    <section id="journeyList" class="journey-list"></section>
  </template>

  <template id="journalTemplate">
    <section class="page-head">
      <div class="eyebrow">Your private record</div>
      <h1>Journal</h1>
      <p class="lead">Entries are saved in this browser on this device.</p>
    </section>

    <section class="card">
      <div class="row between">
        <h2>New entry</h2>
        <button class="ghost small" id="exportJournal">Export</button>
      </div>
      <input id="journalTitle" class="input" placeholder="Optional title" />
      <textarea id="journalText" placeholder="What wants to be heard?"></textarea>
      <div class="row">
        <button class="primary" id="saveJournal">Save entry</button>
        <button class="ghost" id="clearDraft">Clear</button>
      </div>
      <div id="journalStatus" class="status"></div>
    </section>

    <section>
      <div class="section-title-row">
        <h2>Saved entries</h2>
        <span id="entryCount" class="muted"></span>
      </div>
      <div id="journalList" class="journal-list"></div>
    </section>
  </template>

  <template id="toolsTemplate">
    <section class="page-head">
      <div class="eyebrow">Choose what you need</div>
      <h1>Reflection tools</h1>
      <p class="lead">Use one tool at a time. You do not have to “dig deeper” when your system needs rest.</p>
    </section>

    <section class="tool-grid">
      <button class="feature-card" data-goto="grounding"><span class="card-label">Regulation</span><strong>Grounding</strong><span>Orient to the present before reflecting.</span></button>
      <button class="feature-card" data-goto="feelings"><span class="card-label">Emotional literacy</span><strong>Feelings vocabulary</strong><span>Find a word that fits more precisely.</span></button>
      <button class="feature-card" data-goto="triggers"><span class="card-label">Pattern work</span><strong>Triggers & projections</strong><span>Explore activation with curiosity.</span></button>
      <button class="feature-card" data-goto="parts"><span class="card-label">Inner dialogue</span><strong>Parts reflection</strong><span>Meet protective responses without shame.</span></button>
      <button class="feature-card" data-goto="boundaries"><span class="card-label">Relational clarity</span><strong>Boundaries</strong><span>Clarify preference, consent, limits, and choice.</span></button>
      <button class="feature-card" data-goto="integration"><span class="card-label">Close the loop</span><strong>Integration</strong><span>Turn insight into one grounded next step.</span></button>
    </section>
  </template>

  <template id="profileTemplate">
    <section class="page-head">
      <div class="eyebrow">Your pace, not perfection</div>
      <h1>Progress</h1>
      <p class="lead">A simple snapshot of your reflection practice on this device.</p>
    </section>
    <section class="stats-grid">
      <article class="stat"><strong id="statEntries">0</strong><span>journal entries</span></article>
      <article class="stat"><strong id="statDays">0</strong><span>journey days complete</span></article>
      <article class="stat"><strong id="statFavorites">0</strong><span>favorite prompts</span></article>
    </section>
    <section class="card">
      <div class="card-label">Recent emotional words</div>
      <div id="recentEmotions" class="chip-wrap"></div>
    </section>
    <section class="card">
      <h2>Privacy & data</h2>
      <p class="muted">This version stores your journal, journey progress, favorites, and check-ins locally in your browser. Clearing browser storage can erase them.</p>
      <div class="row wrap">
        <button class="secondary" id="exportAll">Export my data</button>
        <button class="danger" id="clearAll">Erase local data</button>
      </div>
    </section>
    <section class="card subtle">
      <h2>Important</h2>
      <p class="muted">Depths of Shadow Reflections is an educational self-reflection tool. It does not diagnose, treat, or replace therapy, medical care, crisis support, or legal advice. Stop an exercise if it feels destabilizing and choose regulation, rest, or qualified support instead.</p>
    </section>
  </template>

  <template id="modalTemplate">
    <div class="modal-backdrop">
      <section class="modal-card">
        <button class="modal-close" aria-label="Close">×</button>
        <div id="modalContent"></div>
      </section>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
